name: Docs Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/spellcheck.yml@be26297fad12a1c4664521df618fc3efcc6d7799
    with:
      files: docs

  docs-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - parallel:
          - name: Run markdownlint
            run: bunx markdownlint-cli2 "docs/**/*.md"

          - name: Run textlint
            run: bunx textlint "docs/**/*.md"

      - name: Audit npm dependencies
        run: bun audit --audit-level=critical
